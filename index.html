<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國際交流活動追蹤手札</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f5f0;--ink:#2b2a28;--soft:#6b6862;--line:#dfdacd;--card:#fff;--nepal:#3d5a73;--nepal-soft:#dce6ec;--japan:#a63446;--japan-soft:#f2dee0;--shadow:0 2px 12px rgba(43,42,40,.07)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(var(--paper),var(--paper)),repeating-linear-gradient(transparent,transparent 27px,var(--line) 28px);color:var(--ink);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding-bottom:54px}button,input,select{font:inherit}button{cursor:pointer}header,.wrap,footer{max-width:1120px;margin:0 auto;padding-left:22px;padding-right:22px}header{padding-top:30px;padding-bottom:14px}h1{font-family:'Noto Serif TC',serif;font-size:30px;margin:0 0 6px}.sub,footer{color:var(--soft);font-size:13px;line-height:1.6}.status{max-width:1120px;margin:0 auto 14px;padding:0 22px}.status span{display:block;border-radius:8px;padding:10px 14px;background:#fdf2d0;border:1px solid #e3c978;color:#6b5416;font-size:13px}.status .ok{background:#e4efe4;border-color:#9dbb9d;color:#3a5a3a}.quick{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:18px}.quick form{display:grid;grid-template-columns:130px 145px 1fr 1.3fr auto;gap:10px;align-items:end}.quick label{display:grid;gap:5px;color:var(--soft);font-size:12px}.quick input,.quick select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:7px 9px}.quick button{min-height:36px;border:1px solid #2f5f54;border-radius:8px;background:#2f5f54;color:#fff;font-weight:700;padding:7px 12px;white-space:nowrap}.tabs{display:flex;gap:8px;margin-bottom:0}.tab{font-weight:700;color:var(--soft);padding:9px 18px;border-radius:8px 8px 0 0;background:transparent;border:1px solid transparent}.tab.active{background:var(--card);border-color:var(--line);border-bottom-color:var(--card);color:var(--ink)}.branches{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border-top:5px solid var(--accent)}.head{background:var(--accent-soft);padding:18px 20px 14px}.head b{font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}.head h2{font-family:'Noto Serif TC',serif;font-size:20px;margin:3px 0 6px}.meta{color:var(--soft);font-size:12.5px;line-height:1.7}.phase-list{padding:8px 12px 16px}.phase{border-bottom:1px dashed var(--line);padding:9px 6px}.phase:last-child{border-bottom:0}.phase-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:8px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:4px 0}.phase-name{font-weight:700;font-size:14.5px}.month{font-family:'Space Mono',monospace;font-size:11px;color:var(--soft);white-space:nowrap}.pill{font-family:'Space Mono',monospace;font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:2px 8px;white-space:nowrap}.twist{color:var(--accent);transition:.15s}.twist.open{transform:rotate(90deg)}.tasks{display:none;padding:8px 0 4px 26px}.tasks.open{display:block}.task{display:flex;align-items:flex-start;gap:8px;padding:5px 4px;border-radius:6px}.task:hover{background:#fafaf7}.task input{margin-top:4px;accent-color:var(--accent)}.task-text{flex:1;line-height:1.5;font-size:13.5px}.task.done .task-text{color:var(--soft);text-decoration:line-through}.icon{background:transparent;border:0;color:var(--soft);padding:2px 4px}.add-task{margin:6px 0 2px 26px;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:4px 9px;font-size:12px}.gantt{display:none;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px;overflow-x:auto}.gantt-grid{display:grid;grid-template-columns:210px repeat(12,86px);min-width:1242px}.label,.m{border-top:1px solid var(--line);min-height:44px}.m{border-left:1px solid var(--line);position:relative}.month-head{font-family:'Space Mono',monospace;font-size:11px;color:var(--soft);text-align:center;padding:6px 0;border-left:1px solid var(--line)}.label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;flex:none}.bar{position:absolute;inset:8px 3px;border-radius:6px;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace}@media(max-width:900px){.quick form,.branches{grid-template-columns:1fr 1fr}.quick label:nth-child(3),.quick label:nth-child(4),.quick button{grid-column:1/-1}}@media(max-width:640px){header,.wrap,footer{padding-left:14px;padding-right:14px}.quick form,.branches{grid-template-columns:1fr}.quick label:nth-child(3),.quick label:nth-child(4),.quick button{grid-column:auto}.phase-row{grid-template-columns:18px minmax(0,1fr)}.month,.pill{grid-column:2;justify-self:start}.tasks{padding-left:0}.task{display:grid;grid-template-columns:auto 1fr}.icon{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<header><h1>國際交流活動追蹤手札</h1><div class="sub">日本與尼泊爾使用不同試算表；畫面合併顯示，新增後會依分類寫入正確表格。</div></header>
<div class="status"><span id="status">正在讀取兩份 Google 試算表...</span></div>
<main class="wrap"><section class="quick"><form id="quickForm"><label>分類<select id="branch"><option value="日本">日本</option><option value="尼泊爾">尼泊爾</option></select></label><label>月份<input id="month" type="month" value="2026-09" required></label><label>階段/主題<input id="phase" placeholder="例：10/20．教材與科目"></label><label>要做的事<input id="task" placeholder="例：確認學生簡報完成度" required></label><button type="submit">新增並排序</button></form></section><nav class="tabs"><button class="tab active" data-view="cards">心智圖檢視</button><button class="tab" data-view="gantt">甘特圖檢視</button></nav><section id="cards" class="branches"></section><section id="gantt" class="gantt"></section></main><footer>資料同步：日本/桃山與尼泊爾各自寫入獨立 Google 試算表。</footer>
<script>
const URLS={
 '日本':'https://script.google.com/macros/s/AKfycbyh90qyGY1MnbMGdK0P6g7Tm7xxFErvK9tXTnjl6uEnPUFfybIAbYEf1d9AXJW16FNT/exec',
 '尼泊爾':'https://script.google.com/macros/s/AKfycbxqhM43MhpjYSJ46FVHChmkeEHf9DzJhaULcWevT1pEfUKU_UxqbIqU_REFLJTm8iMX/exec'
};
const MONTHS=['2026-07','2026-08','2026-09','2026-10','2026-11','2026-12','2027-01','2027-02','2027-03','2027-04','2027-05','2027-06'];
const META={'尼泊爾':{label:'尼泊爾交流',accent:'var(--nepal)',soft:'var(--nepal-soft)',color:'#3D5A73',meta:'118雙語班 / Alena 老師 / 獨立尼泊爾試算表'},'日本':{label:'日本桃山高校交流',accent:'var(--japan)',soft:'var(--japan-soft)',color:'#A63446',meta:'水資源共同研究 / 桃山高校試算表'}};
let tasks=[];let openKeys=new Set();let current='cards';const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function setStatus(text,ok=true){const el=$('status');el.textContent=text;el.className=ok?'ok':'';}
function normMonth(v){if(!v)return'';const t=String(v);if(/^\d{4}-\d{2}$/.test(t))return t;const d=new Date(t);if(Number.isNaN(d.getTime()))return t;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function endpoint(branch){return branch==='尼泊爾'?URLS['尼泊爾']:URLS['日本'];}
async function api(action,params={}){const url=endpoint(params.branch);const qs=new URLSearchParams({action,...params});const d=await fetch(url+'?'+qs).then(r=>r.json());if(!d.ok)throw new Error(d.error||'試算表回應失敗');return d;}
async function listAll(){const packs=await Promise.all(Object.entries(URLS).map(async([branch,url])=>{const d=await fetch(url+'?action=list').then(r=>r.json());if(!d.ok)throw new Error(branch+' 試算表讀取失敗');return (d.tasks||[]).map(x=>({...x,branch:x.branch||branch}));}));return packs.flat();}
function normalize(rows){return (rows||[]).map(r=>({...r,phaseOrder:Number(r.phaseOrder||0),phaseDate:normMonth(r.phaseDate),done:r.done===true||String(r.done).toLowerCase()==='true'}));}
function keyOf(p){return `${p.branch}::${p.phaseOrder}::${p.phaseName}`;}
function groups(){const map=new Map();tasks.forEach(t=>{const k=keyOf(t);if(!map.has(k))map.set(k,{branch:t.branch,phaseOrder:t.phaseOrder,phaseName:t.phaseName,phaseDate:t.phaseDate,items:[]});map.get(k).items.push(t);});return [...map.values()].map(p=>({...p,items:p.items.sort((a,b)=>Number(a.done)-Number(b.done)||a.task.localeCompare(b.task,'zh-Hant'))})).sort((a,b)=>a.phaseDate.localeCompare(b.phaseDate)||a.phaseOrder-b.phaseOrder||a.phaseName.localeCompare(b.phaseName,'zh-Hant'));}
function branches(){return ['尼泊爾','日本'];}function meta(branch){return META[branch];}function defaultPhase(month,task){const m=Number(month.slice(5,7));return `${m||''}月．${task}`;}
async function load(msg='已連接兩份 Google 試算表，資料會分開同步保存。'){try{tasks=normalize(await listAll());setStatus(`${msg}（日本 ${tasks.filter(t=>t.branch==='日本').length} 筆，尼泊爾 ${tasks.filter(t=>t.branch==='尼泊爾').length} 筆）`,true);render();}catch(e){setStatus('無法讀取試算表：'+e.message,false);render();}}
async function addQuick(e){e.preventDefault();const branch=$('branch').value,month=$('month').value,task=$('task').value.trim();if(!branch||!month||!task)return;const phaseName=$('phase').value.trim()||defaultPhase(month,task);const same=tasks.filter(t=>t.branch===branch);const existing=same.find(t=>t.phaseName===phaseName&&t.phaseDate===month);const order=existing?existing.phaseOrder:Math.max(0,...same.map(t=>t.phaseOrder))+1;await api('add',{branch,phaseOrder:order,phaseName,phaseDate:month,task});$('task').value='';await load('新增完成，已寫入正確試算表並依時間排序。');}
async function addToPhase(branch,order,name,date){const task=prompt('新增要做的事：');if(!task)return;await api('add',{branch,phaseOrder:order,phaseName:name,phaseDate:date,task});await load('新增完成，已寫入正確試算表。');}
async function toggle(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;render();try{await api('toggle',{id,branch:t.branch});await load('完成狀態已同步。');}catch(e){await load('同步失敗，已重新讀取。');}}
async function edit(id){const t=tasks.find(x=>x.id===id);if(!t)return;const v=prompt('編輯內容：',t.task);if(!v||v.trim()===t.task)return;await api('update',{id,branch:t.branch,field:'task',value:v.trim()});await load('內容已更新。');}
async function del(id){const t=tasks.find(x=>x.id===id);if(!t||!confirm('確定刪除「'+t.task+'」？'))return;await api('delete',{id,branch:t.branch});await load('已刪除。');}
function renderCards(){const gs=groups();$('cards').innerHTML=branches().map(b=>{const m=meta(b),ps=gs.filter(p=>p.branch===b);return `<article class="card" style="--accent:${m.accent};--accent-soft:${m.soft}"><div class="head"><b>Branch</b><h2>${esc(m.label)}</h2><div class="meta">${esc(m.meta)}</div></div><div class="phase-list">${ps.map(p=>phaseHtml(p)).join('')||'<div class="meta">目前沒有資料</div>'}</div></article>`;}).join('');}
function phaseHtml(p){const k=keyOf(p),open=openKeys.has(k),done=p.items.filter(x=>x.done).length;return `<div class="phase"><button class="phase-row" onclick="toggleOpen('${esc(k)}')"><span class="twist ${open?'open':''}">▶</span><span class="phase-name">${esc(p.phaseName)}</span><span class="month">${esc(p.phaseDate)}</span><span class="pill">${done}/${p.items.length}</span></button><div class="tasks ${open?'open':''}">${p.items.map(taskHtml).join('')}<button class="add-task" onclick="addToPhase('${esc(p.branch)}',${p.phaseOrder},'${esc(p.phaseName)}','${esc(p.phaseDate)}')">+ 新增事項</button></div></div>`;}
function taskHtml(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggle('${esc(t.id)}')"><div class="task-text">${esc(t.task)}</div><button class="icon" onclick="edit('${esc(t.id)}')">編輯</button><button class="icon" onclick="del('${esc(t.id)}')">刪除</button></div>`;}
function renderGantt(){const gs=groups();let html=`<div class="gantt-grid"><div></div>${MONTHS.map(m=>`<div class="month-head">${m.replace('-','.')}</div>`).join('')}`;gs.forEach(p=>{const m=meta(p.branch),done=p.items.filter(x=>x.done).length;html+=`<div class="label"><span class="dot" style="background:${m.color}"></span>${esc(p.phaseName)}</div>${MONTHS.map(mon=>`<div class="m">${mon===p.phaseDate?`<div class="bar" style="background:${m.color}">${done}/${p.items.length}</div>`:''}</div>`).join('')}`;});$('gantt').innerHTML=html+'</div>';}
function toggleOpen(k){openKeys.has(k)?openKeys.delete(k):openKeys.add(k);render();}function render(){renderCards();renderGantt();$('cards').style.display=current==='cards'?'grid':'none';$('gantt').style.display=current==='gantt'?'block':'none';}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');current=btn.dataset.view;render();}));$('quickForm').addEventListener('submit',addQuick);load();
</script>
</body>
</html>
