<style>
  :root{
    --paper:#F7F5F0;

    --line:#DFDACD;

  }
  h1{

    font-size:28px;
    margin:0 0 4px;

  }
  .sub{
    color:var(--ink-soft);

  }
  .banner{

  .branch-meta{

  .phase{

  .phase-row{

    gap:10px;
    cursor:pointer;
    user-select:none;
  }
  .twist{

  .phase-date{

    font-size:11px;
    color:var(--ink-soft);

    padding:5px 4px;
    border-radius:6px;

  .icon-btn{

let tasks = seedData();
let connected = false;
let expanded = new Set(); // phase keys open
let currentView = 'mindmap';

function phaseKey(branch, phaseOrder, phaseName){ return branch+'::'+phaseOrder+'::'+phaseName; }

function isConfigured(){
  return CONFIG.WEBAPP_URL && CONFIG.WEBAPP_URL.indexOf('http') === 0;
}

async function api(action, params){
  if(!isConfigured()) return null;
  const qs = new URLSearchParams({action, ...params}).toString();
  const res = await fetch(CONFIG.WEBAPP_URL + '?' + qs);
  return res.json();
}

async function loadFromSheet(){
  const banner = document.getElementById('banner');
  if(!isConfigured()){
    connected = false;
    banner.className = 'banner';
    banner.textContent = '尚未連接 Google 試算表：目前顯示的是範例資料，重新整理會還原。請依 CONFIG.WEBAPP_URL 說明連接後即可永久保存與同步。';
    render();
    return;
  }
  try{
    const data = await api('list', {});
    if(data && data.ok){
      tasks = data.tasks;
      connected = true;
      banner.className = 'banner ok';
      banner.textContent = '✓ 已連接 Google 試算表，所有變更會即時同步保存。';
    } else {
      throw new Error(data && data.error);
    }
  }catch(err){
    connected = false;
    banner.className = 'banner';
    banner.textContent = '⚠ 無法連接試算表（' + err.message + '），暫時顯示範例資料，變更不會被保存。';
  }
  render();
}

async function addTask(branch, phaseOrder, phaseName, phaseDate){
  const text = prompt('新增任務內容：');
  if(!text) return;
  if(connected){
    await api('add', {branch, phaseOrder, phaseName, phaseDate, task:text});
    await loadFromSheet();
  } else {
    tasks.push({id:'local'+Date.now(), branch, phaseOrder, phaseName, phaseDate, task:text, done:false, notes:''});
    render();
  }
}

async function addPhase(branch){
  const name = prompt('新階段名稱（例如：4月．期末檢討）：');
  if(!name) return;
  const date = prompt('對應月份（格式 YYYY-MM，例如 2027-04）：', '2027-04') || '';
  const maxOrder = Math.max(0, ...tasks.filter(t=>t.branch===branch).map(t=>t.phaseOrder));
  await addTask(branch, maxOrder+1, name, date);
}

async function toggleDone(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = !t.done;
  render();
  if(connected) await api('toggle', {id});
}

async function editTaskText(id, newText){
  const t = tasks.find(x=>x.id===id);
  if(!t || t.task === newText) return;
  t.task = newText;
  if(connected) await api('update', {id, field:'task', value:newText});
}

async function deleteTask(id){
  if(!confirm('確定要刪除這個項目嗎？')) return;
  tasks = tasks.filter(x=>x.id!==id);
  render();
  if(connected) await api('delete', {id});
}

async function duplicateTask(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  if(connected){
    await api('duplicate', {id});
    await loadFromSheet();
  } else {
    tasks.push({...t, id:'local'+Date.now(), task:t.task+'（複製）', done:false});
    render();
  }
}

function groupByBranchPhase(branch){
  const map = new Map();
  tasks.filter(t=>t.branch===branch).forEach(t=>{
    const key = phaseKey(t.branch, t.phaseOrder, t.phaseName);
    if(!map.has(key)) map.set(key, {phaseOrder:t.phaseOrder, phaseName:t.phaseName, phaseDate:t.phaseDate, items:[]});
    map.get(key).items.push(t);
  });
  return [...map.values()].sort((a,b)=>a.phaseOrder-b.phaseOrder);
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderMindmap(){
  const root = document.getElementById('view-mindmap');
  let html = '<div class="branches">';
  for(const branchKey of Object.keys(BRANCHES)){
    const b = BRANCHES[branchKey];
    const phases = groupByBranchPhase(branchKey);
    html += `<div class="branch-card" style="--accent:${b.accent};--accent-soft:${b.accentSoft}">
      <div class="branch-head">
        <div class="eyebrow">Branch</div>
        <h2>${b.label}</h2>
        <div class="branch-meta">${b.meta.map(m=>esc(m)).join('<br>')}</div>
      </div>
      <div class="phase-list">`;
    phases.forEach(p=>{
      const key = phaseKey(branchKey, p.phaseOrder, p.phaseName);
      const open = expanded.has(key);
      const doneCount = p.items.filter(i=>i.done).length;
      html += `<div class="phase">
        <div class="phase-row" onclick="toggleExpand('${key}')">
          <span class="twist ${open?'open':''}">▶</span>
          <span class="phase-name">${esc(p.phaseName)}</span>
          <span class="phase-date">${esc(p.phaseDate)}</span>
          <span class="progress-pill">${doneCount}/${p.items.length}</span>
        </div>
        <div class="task-list ${open?'open':''}">`;
      p.items.forEach(t=>{
        html += `<div class="task-row ${t.done?'done':''}">
          <input type="checkbox" ${t.done?'checked':''} onchange="toggleDone('${t.id}')">
          <div class="task-text" contenteditable="true" onblur="editTaskText('${t.id}', this.innerText.trim())">${esc(t.task)}</div>
          <button class="icon-btn" title="複製" onclick="duplicateTask('${t.id}')">⧉</button>
          <button class="icon-btn" title="刪除" onclick="deleteTask('${t.id}')">✕</button>
        </div>`;
      });
      html += `<button class="add-task-btn" onclick="addTask('${branchKey}', ${p.phaseOrder}, '${p.phaseName.replace(/'/g,"\\'")}', '${p.phaseDate}')">+ 新增任務</button>`;
      html += `</div></div>`;
    });
    html += `</div><button class="add-phase-btn" onclick="addPhase('${branchKey}')">+ 新增階段</button></div>`;
  }
  html += '</div>';
  root.innerHTML = html;
}

function monthDiff(m){ // index within MONTHS, or -1
  return MONTHS.indexOf(m);
}

function renderGantt(){
  const root = document.getElementById('view-gantt');
  let rows = [];
  for(const branchKey of Object.keys(BRANCHES)){
    groupByBranchPhase(branchKey).forEach(p=>rows.push({branch:branchKey, ...p}));
  }
  let grid = `<div class="gantt-wrap"><div class="gantt-grid">
    <div class="corner"></div>${MONTHS.map(m=>`<div class="month-label">${MONTH_LABEL(m)}</div>`).join('')}`;
  rows.forEach((p,idx)=>{
    const b = BRANCHES[p.branch];
    const key = phaseKey(p.branch, p.phaseOrder, p.phaseName);
    const open = expanded.has('gantt::'+key);
    const doneCount = p.items.filter(i=>i.done).length;
    const mi = monthDiff(p.phaseDate);
    grid += `<div class="gantt-row">
      <div class="row-label" onclick="toggleExpand('gantt::${key}')"><span class="dot" style="background:${b.color}"></span>${esc(p.phaseName)}</div>
      ${MONTHS.map((m,i)=>{
        if(i===mi){
          return `<div class="gantt-cell"><div class="gantt-bar" style="background:${b.color}" onclick="toggleExpand('gantt::${key}')">${doneCount}/${p.items.length}</div></div>`;
        }
        return `<div class="gantt-cell"></div>`;
      }).join('')}
      <div class="gantt-tasks ${open?'open':''}">
        ${p.items.map(t=>`<div class="task-row ${t.done?'done':''}">
          <input type="checkbox" ${t.done?'checked':''} onchange="toggleDone('${t.id}')">
          <div class="task-text" contenteditable="true" onblur="editTaskText('${t.id}', this.innerText.trim())">${esc(t.task)}</div>
          <button class="icon-btn" title="複製" onclick="duplicateTask('${t.id}')">⧉</button>
          <button class="icon-btn" title="刪除" onclick="deleteTask('${t.id}')">✕</button>
        </div>`).join('')}
        <button class="add-task-btn" onclick="addTask('${p.branch}', ${p.phaseOrder}, '${p.phaseName.replace(/'/g,"\\'")}', '${p.phaseDate}')">+ 新增任務</button>
      </div>
    </div>`;
  });
  grid += `</div></div>`;
  root.innerHTML = grid;
}

function toggleExpand(key){
  if(expanded.has(key)) expanded.delete(key); else expanded.add(key);
  render();
}

function render(){
  if(currentView==='mindmap') renderMindmap(); else renderGantt();
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    document.getElementById('view-mindmap').style.display = currentView==='mindmap' ? 'block':'none';
    document.getElementById('view-gantt').style.display = currentView==='gantt' ? 'block':'none';
    render();
  });
});

loadFromSheet();
</script>
</body>
</html>
