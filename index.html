<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>國際交流活動追蹤手札</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f5f0;--ink:#2b2a28;--soft:#6b6862;--line:#dfdacd;--card:#fff;--nepal:#3d5a73;--nepal-soft:#dce6ec;--japan:#a63446;--japan-soft:#f2dee0;--green:#2f5f54;--shadow:0 2px 12px rgba(43,42,40,.07)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(var(--paper),var(--paper)),repeating-linear-gradient(transparent,transparent 27px,var(--line) 28px);color:var(--ink);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding-bottom:56px}button,input{font:inherit}button{cursor:pointer}header,.wrap,footer{max-width:1120px;margin:0 auto;padding-left:22px;padding-right:22px}header{padding-top:30px;padding-bottom:14px}h1{font-family:'Noto Serif TC',serif;font-size:30px;margin:0 0 6px}.sub,footer{color:var(--soft);font-size:13px;line-height:1.6}.status{max-width:1120px;margin:0 auto 14px;padding:0 22px}.status span{display:block;border-radius:8px;padding:10px 14px;background:#fdf2d0;border:1px solid #e3c978;color:#6b5416;font-size:13px}.status .ok{background:#e4efe4;border-color:#9dbb9d;color:#3a5a3a}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}.workspace button{min-height:96px;text-align:left;background:#fff;border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;color:var(--ink)}.workspace button.active{background:var(--soft-bg);border-color:var(--accent)}.workspace small{display:block;font-family:'Space Mono',monospace;color:var(--accent);margin-bottom:4px}.workspace strong{display:block;font-family:'Noto Serif TC',serif;font-size:20px;margin-bottom:5px}.workspace span{display:block;color:var(--soft);font-size:12.5px;line-height:1.5}.workspace b{display:block;color:var(--accent);font-size:12px;margin-top:8px}.quick{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:18px}.quick form{display:grid;grid-template-columns:140px 1fr 1.3fr auto;gap:10px;align-items:end}.quick label{display:grid;gap:5px;color:var(--soft);font-size:12px}.quick input{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:7px 9px}.quick button{min-height:38px;border:1px solid var(--green);border-radius:8px;background:var(--green);color:#fff;font-weight:700;padding:7px 12px;white-space:nowrap}.tabs{display:flex;gap:8px;margin-bottom:0}.tab{font-family:'Noto Serif TC',serif;font-weight:700;color:var(--soft);padding:9px 18px;border-radius:8px 8px 0 0;background:transparent;border:1px solid transparent}.tab.active{background:var(--card);border-color:var(--line);border-bottom-color:var(--card);color:var(--ink)}.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border-top:5px solid var(--accent)}.head{background:var(--soft-bg);padding:18px 20px 14px}.head small{font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}.head h2{font-family:'Noto Serif TC',serif;font-size:20px;margin:3px 0 6px}.meta{color:var(--soft);font-size:12.5px;line-height:1.7}.phase-list{padding:8px 12px 16px}.phase{border-bottom:1px dashed var(--line);padding:9px 6px}.phase:last-child{border-bottom:0}.phase-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:8px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:4px 0}.phase-name{font-weight:700;font-size:14.5px}.month{font-family:'Space Mono',monospace;font-size:11px;color:var(--soft);white-space:nowrap}.pill{font-family:'Space Mono',monospace;font-size:10.5px;background:var(--soft-bg);color:var(--accent);border-radius:20px;padding:2px 8px;white-space:nowrap}.twist{color:var(--accent);transition:.15s}.twist.open{transform:rotate(90deg)}.tasks{display:none;padding:8px 0 4px 26px}.tasks.open{display:block}.task{display:flex;align-items:flex-start;gap:8px;padding:5px 4px;border-radius:6px}.task:hover{background:#fafaf7}.task input{margin-top:4px;accent-color:var(--accent)}.task-text{flex:1;line-height:1.5;font-size:13.5px;outline:none}.task-text:focus{box-shadow:0 0 0 1px var(--line);border-radius:4px}.task.done .task-text{color:var(--soft);text-decoration:line-through}.icon{background:transparent;border:0;color:var(--soft);padding:2px 4px}.add-task,.add-phase{margin:6px 0 2px 26px;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:4px 9px;font-size:12px}.add-phase{display:block;width:calc(100% - 24px);margin:12px 12px 0}.gantt{display:none;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px;overflow-x:auto}.gantt-grid{display:grid;grid-template-columns:210px repeat(12,86px);min-width:1242px}.label,.m{border-top:1px solid var(--line);min-height:44px}.m{border-left:1px solid var(--line);position:relative}.month-head{font-family:'Space Mono',monospace;font-size:11px;color:var(--soft);text-align:center;padding:6px 0;border-left:1px solid var(--line)}.label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;flex:none}.bar{position:absolute;inset:8px 3px;border-radius:6px;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace}@media(max-width:900px){.quick form{grid-template-columns:1fr 1fr}.quick label:nth-of-type(2),.quick label:nth-of-type(3),.quick button{grid-column:1/-1}}@media(max-width:680px){header,.wrap,footer{padding-left:14px;padding-right:14px}.workspace,.quick form{grid-template-columns:1fr}.quick label:nth-of-type(2),.quick label:nth-of-type(3),.quick button{grid-column:auto}.phase-row{grid-template-columns:18px minmax(0,1fr)}.month,.pill{grid-column:2;justify-self:start}.tasks{padding-left:0}.task{display:grid;grid-template-columns:auto 1fr}.icon{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<header><h1>國際交流活動追蹤手札</h1><div class="sub">先選擇尼泊爾交流或桃山高校交流，再新增資料；兩邊會分別寫入各自的 Google 試算表。</div></header>
<div class="status"><span id="status">正在讀取兩份 Google 試算表...</span></div>
<main class="wrap">
<section class="workspace" aria-label="選擇交流工作區">
<button class="active" type="button" data-branch="尼泊爾" style="--accent:var(--nepal);--soft-bg:var(--nepal-soft)"><small>Nepal</small><strong>尼泊爾交流</strong><span>輸入與查看 118 雙語班的尼泊爾交流資料</span><b></b></button>
<button type="button" data-branch="日本" style="--accent:var(--japan);--soft-bg:var(--japan-soft)"><small>Momoyama</small><strong>桃山高校交流</strong><span>輸入與查看日本桃山高校交流資料</span><b></b></button>
</section>
<section class="quick"><form id="quickForm"><input id="branch" type="hidden" value="尼泊爾"><label>月份<input id="month" type="month" value="2026-09" required></label><label>階段/主題<input id="phase" placeholder="例：10/20．教材與科目"></label><label>要做的事<input id="task" placeholder="例：確認學生簡報完成度" required></label><button type="submit">新增並排序</button></form></section>
<nav class="tabs"><button class="tab active" data-view="cards">心智圖檢視</button><button class="tab" data-view="gantt">甘特圖檢視</button></nav>
<section id="cards"></section><section id="gantt" class="gantt"></section>
</main><footer>資料同步：尼泊爾與桃山各自寫入獨立 Google 試算表。</footer>
<script>
const URLS={'日本':'https://script.google.com/macros/s/AKfycbyh90qyGY1MnbMGdK0P6g7Tm7xxFErvK9tXTnjl6uEnPUFfybIAbYEf1d9AXJW16FNT/exec','尼泊爾':'https://script.google.com/macros/s/AKfycbxqhM43MhpjYSJ46FVHChmkeEHf9DzJhaULcWevT1pEfUKU_UxqbIqU_REFLJTm8iMX/exec'};
const META={'尼泊爾':{label:'尼泊爾交流',accent:'var(--nepal)',soft:'var(--nepal-soft)',color:'#3D5A73',meta:['班級：118雙語班','帶領老師：Alena 老師','交流期間：2026/10、2026/12、2027/01']},'日本':{label:'桃山高校交流',accent:'var(--japan)',soft:'var(--japan-soft)',color:'#A63446',meta:['主題：水資源共同研究','每月一次線上會議','2027/3/15-17 來訪台灣']}};
const MONTHS=['2026-07','2026-08','2026-09','2026-10','2026-11','2026-12','2027-01','2027-02','2027-03','2027-04','2027-05','2027-06'];let tasks=[],activeBranch='尼泊爾',openKeys=new Set(),view='cards';const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}function jsq(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ');}function normMonth(v){if(!v)return'';const t=String(v);if(/^\d{4}-\d{2}$/.test(t))return t;const d=new Date(t);if(Number.isNaN(d.getTime()))return t;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}function keyOf(t){return `${t.branch}::${t.phaseOrder}::${t.phaseName}`;}function setStatus(text,ok=true){const el=$('status');el.textContent=text;el.className=ok?'ok':'';}function endpoint(branch){return branch==='尼泊爾'?URLS['尼泊爾']:URLS['日本'];}
async function api(action,params={}){const res=await fetch(endpoint(params.branch)+'?'+new URLSearchParams({action,...params}));const data=await res.json();if(!data.ok)throw new Error(data.error||'試算表回應失敗');return data;}async function listAll(){const packs=await Promise.all(Object.entries(URLS).map(async([branch,url])=>{const data=await fetch(url+'?action=list').then(r=>r.json());if(!data.ok)throw new Error(branch+' 試算表讀取失敗');return (data.tasks||[]).map(t=>({...t,branch:t.branch||branch}));}));return packs.flat();}
function normalize(rows){return rows.map(r=>({...r,phaseOrder:Number(r.phaseOrder||0),phaseDate:normMonth(r.phaseDate),done:r.done===true||String(r.done).toLowerCase()==='true'}));}function summary(branch){const rows=tasks.filter(t=>t.branch===branch),done=rows.filter(t=>t.done).length;return `${rows.length} 項工作，已完成 ${done} 項`;}
async function load(msg='已連接兩份 Google 試算表，資料會分開同步保存。'){try{tasks=normalize(await listAll());setStatus(`${msg}（桃山 ${tasks.filter(t=>t.branch==='日本').length} 筆，尼泊爾 ${tasks.filter(t=>t.branch==='尼泊爾').length} 筆）`,true);}catch(e){setStatus('無法讀取試算表：'+e.message,false);}render();}
function setBranch(branch){activeBranch=branch;$('branch').value=branch;document.querySelectorAll('.workspace button').forEach(btn=>btn.classList.toggle('active',btn.dataset.branch===branch));render();}
function groups(branch=activeBranch){const map=new Map();tasks.filter(t=>t.branch===branch).forEach(t=>{const k=keyOf(t);if(!map.has(k))map.set(k,{branch:t.branch,phaseOrder:t.phaseOrder,phaseName:t.phaseName,phaseDate:t.phaseDate,items:[]});map.get(k).items.push(t);});return [...map.values()].sort((a,b)=>normMonth(a.phaseDate).localeCompare(normMonth(b.phaseDate))||a.phaseOrder-b.phaseOrder||a.phaseName.localeCompare(b.phaseName,'zh-Hant'));}
function defaultPhase(month,task){const m=Number((month||'').slice(5,7));return `${m||'新增'}月．${task}`;}async function addQuick(e){e.preventDefault();const branch=$('branch').value,month=$('month').value,task=$('task').value.trim(),phaseName=$('phase').value.trim()||defaultPhase(month,task);if(!branch||!month||!task)return;const same=tasks.filter(t=>t.branch===branch),exist=same.find(t=>normMonth(t.phaseDate)===month&&t.phaseName===phaseName),order=exist?exist.phaseOrder:Math.max(0,...same.map(t=>Number(t.phaseOrder||0)))+1;await api('add',{branch,phaseOrder:order,phaseName,phaseDate:month,task});$('task').value='';await load('新增完成，已寫入目前選擇的工作區。');}
async function addTask(branch,phaseOrder,phaseName,phaseDate){const task=prompt('新增任務內容：');if(!task)return;await api('add',{branch,phaseOrder,phaseName,phaseDate,task});await load('新增完成。');}async function addPhase(branch){const name=prompt('新階段名稱：');if(!name)return;const date=prompt('對應月份（YYYY-MM）：','2027-04')||'';const max=Math.max(0,...tasks.filter(t=>t.branch===branch).map(t=>Number(t.phaseOrder||0)));await addTask(branch,max+1,name,date);}async function toggleDone(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;render();await api('toggle',{id,branch:t.branch});await load('完成狀態已同步。');}async function editTaskText(id,newText){const t=tasks.find(x=>x.id===id);if(!t||!newText||t.task===newText)return;await api('update',{id,branch:t.branch,field:'task',value:newText});await load('內容已更新。');}async function deleteTask(id){const t=tasks.find(x=>x.id===id);if(!t||!confirm('確定要刪除這個項目嗎？'))return;await api('delete',{id,branch:t.branch});await load('已刪除。');}async function duplicateTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;await api('duplicate',{id,branch:t.branch});await load('已複製。');}
function phaseHtml(p){const k=keyOf(p),open=openKeys.has(k),done=p.items.filter(i=>i.done).length;return `<div class="phase"><button class="phase-row" onclick="toggleExpand('${jsq(k)}')"><span class="twist ${open?'open':''}">▶</span><span class="phase-name">${esc(p.phaseName)}</span><span class="month">${esc(p.phaseDate)}</span><span class="pill">${done}/${p.items.length}</span></button><div class="tasks ${open?'open':''}">${p.items.map(taskHtml).join('')}<button class="add-task" onclick="addTask('${jsq(p.branch)}',${p.phaseOrder},'${jsq(p.phaseName)}','${jsq(p.phaseDate)}')">+ 新增任務</button></div></div>`;}function taskHtml(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleDone('${jsq(t.id)}')"><div class="task-text" contenteditable="true" onblur="editTaskText('${jsq(t.id)}',this.innerText.trim())">${esc(t.task)}</div><button class="icon" onclick="duplicateTask('${jsq(t.id)}')">複製</button><button class="icon" onclick="deleteTask('${jsq(t.id)}')">刪除</button></div>`;}
function renderCards(){const m=META[activeBranch],ps=groups();$('cards').innerHTML=`<article class="card" style="--accent:${m.accent};--soft-bg:${m.soft}"><div class="head"><small>Branch</small><h2>${m.label}</h2><div class="meta">${m.meta.map(esc).join('<br>')}</div></div><div class="phase-list">${ps.map(phaseHtml).join('')||'<div class="meta">目前沒有資料</div>'}</div><button class="add-phase" onclick="addPhase('${jsq(activeBranch)}')">+ 新增階段</button></article>`;}
function renderGantt(){const ps=groups();let html=`<div class="gantt-grid"><div></div>${MONTHS.map(m=>`<div class="month-head">${m.replace('-','.')}</div>`).join('')}`;ps.forEach(p=>{const m=META[p.branch],done=p.items.filter(i=>i.done).length;html+=`<div class="label"><span class="dot" style="background:${m.color}"></span>${esc(p.phaseName)}</div>${MONTHS.map(mon=>`<div class="m">${mon===p.phaseDate?`<div class="bar" style="background:${m.color}">${done}/${p.items.length}</div>`:''}</div>`).join('')}`;});$('gantt').innerHTML=html+'</div>';}
function toggleExpand(k){openKeys.has(k)?openKeys.delete(k):openKeys.add(k);render();}function render(){document.querySelectorAll('.workspace button').forEach(btn=>{btn.querySelector('b').textContent=summary(btn.dataset.branch)});renderCards();renderGantt();$('cards').style.display=view==='cards'?'block':'none';$('gantt').style.display=view==='gantt'?'block':'none';}
document.querySelectorAll('.workspace button').forEach(btn=>btn.addEventListener('click',()=>setBranch(btn.dataset.branch)));document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');view=btn.dataset.view;render();}));$('quickForm').addEventListener('submit',addQuick);load();
</script>
</body>
</html>
